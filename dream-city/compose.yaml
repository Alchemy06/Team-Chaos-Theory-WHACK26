services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    volumes:
      # Share source files for live editing.
      - .:/app

      # Keep container dependencies and build files separate.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache: